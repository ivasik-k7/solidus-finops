# ---------------------------------------------------------------------------
# release.yml — Solidus FinOps tagged release publisher
#
# Purpose
# -------
# When a maintainer pushes a semver tag (vX.Y.Z), this workflow cuts the
# corresponding GitHub Release AND publishes a cryptographically verifiable
# SLSA build-provenance attestation for the release artifacts.
#
# Why this version changed
# ------------------------
# The previous version generated provenance with actions/attest-build-provenance,
# which writes attestations to the repository ATTESTATION STORE (verified with
# `gh attestation verify`). OpenSSF Scorecard's "Signed-Releases" check does NOT
# read that store — it only scans the last few releases' ASSETS for files named
# *.sig, *.asc, *.sigstore.json, *.intoto.jsonl, etc. So the old approach could
# never satisfy the check, regardless of whether it ran. (It was also gated on
# optional diagram files, so it frequently produced nothing at all.)
#
# This version fixes that by:
#   1. Building a deterministic source archive (the thing downstream FinOps
#      consumers actually pin as a Terraform module ref). git archive is
#      reproducible for a given commit and honors .gitattributes export-ignore.
#   2. Publishing the GitHub Release with that archive (+ any rendered diagrams)
#      as real, downloadable assets — not just the auto-generated source tarball,
#      which Scorecard explicitly ignores.
#   3. Generating genuine SLSA Build L3 provenance over those artifacts via the
#      SLSA generic generator, which uploads a `*.intoto.jsonl` file as a release
#      asset. THAT file is what flips Scorecard's Signed-Releases to the top tier.
#
# Downstream consumers verify with slsa-verifier:
#   slsa-verifier verify-artifact solidus-finops-X.Y.Z.tar.gz \
#     --provenance-path <name>.intoto.jsonl \
#     --source-uri github.com/ivasik-k7/solidus-finops \
#     --source-tag vX.Y.Z
#
# Action pinning
# --------------
# Every `uses:` is pinned to a full-length 40-char commit SHA with a trailing
# semver comment — EXCEPT the SLSA generator. The SLSA reusable workflow MUST be
# referenced by a `@vX.Y.Z` tag (not a SHA, not a short tag): slsa-verifier
# verifies the trusted builder by its ref, and pinning it by digest makes the
# build fail. This is the one documented, intentional exception to SHA pinning.
# ---------------------------------------------------------------------------

name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
      # base64(sha256sum of all release artifacts) — fed to the SLSA generator.
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag is strict semver
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="${GITHUB_REF#refs/tags/}"
          echo "Tag pushed: ${tag_ref}"

          # Strict release tag: vMAJOR.MINOR.PATCH only.
          # Pre-release tags (e.g. v0.3.0-rc.1) use the relaxed pattern below.
          strict_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          prerelease_re='^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)(\.[0-9]+)?$'

          if [[ "${tag_ref}" =~ ${strict_re} ]]; then
            is_prerelease="false"
          elif [[ "${tag_ref}" =~ ${prerelease_re} ]]; then
            is_prerelease="true"
          else
            echo "::error::Tag '${tag_ref}' does not match required semver format."
            echo "::error::Expected 'vMAJOR.MINOR.PATCH' (e.g. v0.2.1) or a pre-release like 'v0.3.0-rc.1'."
            exit 1
          fi

          version="${tag_ref#v}"

          {
            echo "tag=${tag_ref}"
            echo "version=${version}"
            echo "is_prerelease=${is_prerelease}"
          } >> "${GITHUB_OUTPUT}"

          echo "Resolved version: ${version} (prerelease=${is_prerelease})"

      - name: Extract changelog section for this version
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.validate.outputs.version }}"
          changelog_path="CHANGELOG.md"

          if [[ ! -f "${changelog_path}" ]]; then
            echo "::error::CHANGELOG.md not found at repo root."
            exit 1
          fi

          # Extract lines between '## [X.Y.Z]' and the next '## [' header.
          # Matches on the bracketed version only, so it is em-dash agnostic.
          notes="$(
            awk -v ver="${version}" '
              BEGIN { capture = 0 }
              /^## \[/ {
                if (capture == 1) { exit }
                if ($0 ~ "^## \\[" ver "\\]") { capture = 1; next }
              }
              capture == 1 { print }
            ' "${changelog_path}"
          )"

          # Trim leading/trailing blank lines, preserving internal blanks.
          notes="$(printf '%s\n' "${notes}" | awk 'NF { found = 1 } found { print }' | tac | awk 'NF { found = 1 } found { print }' | tac)"

          if [[ -z "${notes}" ]]; then
            echo "::error::No CHANGELOG.md section found for version ${version}."
            echo "::error::Add a CHANGELOG.md section for ${version} first (format: '## [${version}] — YYYY-MM-DD')."
            exit 1
          fi

          echo "Extracted $(printf '%s\n' "${notes}" | wc -l) lines of release notes."

          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "notes<<${delimiter}"
            printf '%s\n' "${notes}"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build reproducible source archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.validate.outputs.version }}"
          name="solidus-finops-${version}"
          archive="${name}.tar.gz"

          # Deterministic archive of the tracked source at this exact commit.
          # This is the artifact consumers pin and verify — not the runner's
          # working tree, and not GitHub's auto-generated (and Scorecard-ignored)
          # source tarball.
          git archive --format=tar.gz \
            --prefix="${name}/" \
            -o "${archive}" \
            HEAD

          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
          echo "Built ${archive} ($(du -h "${archive}" | cut -f1))"

      - name: Collect diagram assets (if rendered)
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "diagrams/aws-architecture.png"
            "diagrams/aws-architecture.svg"
            "diagrams/framework-structure.png"
            "diagrams/framework-structure.svg"
          )

          found=()
          for path in "${candidates[@]}"; do
            if [[ -f "${path}" ]]; then
              echo "Including asset: ${path}"
              found+=("${path}")
            else
              echo "Skipping missing asset: ${path}"
            fi
          done

          if [[ "${#found[@]}" -eq 0 ]]; then
            echo "files=" >> "${GITHUB_OUTPUT}"
          else
            {
              echo "files<<EOF_ASSETS"
              printf '%s\n' "${found[@]}"
              echo "EOF_ASSETS"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Compute SLSA subject digests
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          # Subjects = the source archive plus any rendered diagrams. The SLSA
          # generator signs provenance binding each of these SHA-256 digests to
          # this workflow at this tag.
          subjects=( "${{ steps.archive.outputs.archive }}" )
          for d in \
            "diagrams/aws-architecture.png" \
            "diagrams/aws-architecture.svg" \
            "diagrams/framework-structure.png" \
            "diagrams/framework-structure.svg"; do
            [[ -f "${d}" ]] && subjects+=( "${d}" )
          done

          hashes="$(sha256sum "${subjects[@]}" | base64 -w0)"
          echo "hashes=${hashes}" >> "${GITHUB_OUTPUT}"
          echo "Hashed subjects: ${subjects[*]}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8  # v2.0.9
        with:
          tag_name: ${{ steps.validate.outputs.tag }}
          name: Solidus FinOps v${{ steps.validate.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ steps.validate.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: false
          files: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.assets.outputs.files }}

  # -------------------------------------------------------------------------
  # SLSA Build L3 provenance.
  #
  # This job calls the SLSA generic generator as a REUSABLE WORKFLOW. It signs
  # provenance for the digests produced above (keyless Sigstore via the runner's
  # OIDC token, logged to Rekor) and, with upload-assets, attaches the resulting
  # `*.intoto.jsonl` to the release for this tag. That asset is what OpenSSF
  # Scorecard's Signed-Releases check detects.
  #
  # NOTE THE PINNING EXCEPTION: this `uses:` is intentionally pinned to a
  # version TAG (@v2.1.0), not a commit SHA. The SLSA framework requires it so
  # the trusted builder's ref can be verified by slsa-verifier; a SHA pin will
  # fail the build. Do not "fix" this to a SHA. Bump the tag via Renovate's SLSA
  # preset rather than Dependabot SHA bumps.
  # -------------------------------------------------------------------------
  provenance:
    name: Generate SLSA provenance
    needs: [release]
    permissions:
      actions: read       # To read the workflow path for provenance.
      id-token: write     # To mint the OIDC token for keyless signing.
      contents: write     # To upload the provenance asset to the release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.release.outputs.tag }}