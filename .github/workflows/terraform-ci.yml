# ---------------------------------------------------------------------------
# terraform-ci.yml
#
# Gold-standard Terraform CI for Solidus FinOps — a multi-module AWS FinOps
# framework with curated examples (minimal / selective / production /
# cloudability-complement).
#
# What this workflow does
# -----------------------
#   1. fmt       — enforces canonical formatting across every .tf file
#   2. tflint    — lints with the repo-root .tflint.hcl ruleset
#   3. validate  — runs `terraform init -backend=false && terraform validate`
#                  on the root module AND every example, in a fail-fast: false
#                  matrix so contributors see every broken path in one run
#   4. checkov   — hard-fails on new security findings (soft_fail: false);
#                  framework-wide skips are documented in
#                  docs/COMPLIANCE_NOTES.md
#   5. summary   — posts a markdown pass/fail table for the validate matrix
#                  to the GitHub Actions job summary so reviewers can see
#                  which example regressed at a glance
#
# Why it's shaped this way
# ------------------------
# * The framework ships 7 modules under modules/<name>/ plus 4 examples.
#   A change to a shared variable or local can silently break a single
#   example. The matrix validate step is the cheapest insurance against
#   that — Terraform's plugin-cache makes the marginal cost ~5 seconds
#   per path.
# * Concurrency cancels superseded runs on the same ref so a fast push
#   train doesn't queue stale jobs.
# * paths: filter keeps docs-only PRs out of the Terraform gate; the
#   filter intentionally covers .py because lambda/<name>.py is packaged
#   into the modules and a syntax error there would surface at apply.
# * Every action is pinned to an immutable full-length commit SHA with a
#   trailing comment giving the human-readable semver — this satisfies the
#   OpenSSF Scorecard "Pinned-Dependencies" heuristic (tags are mutable,
#   SHAs are not) while preserving Dependabot's ability to recognize the
#   version for major-bump notifications.
# * `permissions:` is scoped to the minimum (contents: read, plus
#   pull-requests: write so the Checkov action can annotate the diff).
# ---------------------------------------------------------------------------

name: terraform-ci

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**/*.py"
      - ".github/workflows/terraform-ci.yml"
      - ".tflint.hcl"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**/*.py"
      - ".github/workflows/terraform-ci.yml"
      - ".tflint.hcl"

# Cancel superseded runs on the same ref. The PR head ref and the push
# ref share the same concurrency group, so the latest commit always wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.6.6"
  TF_PLUGIN_CACHE_DIR: "/home/runner/.terraform.d/plugin-cache"

jobs:
  # -------------------------------------------------------------------------
  # fmt — canonical formatting across the entire tree
  # -------------------------------------------------------------------------
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check -recursive
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive

  # -------------------------------------------------------------------------
  # validate — matrix init+validate over root + every example
  # -------------------------------------------------------------------------
  validate:
    name: validate (${{ matrix.path }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        path:
          - "."
          - "examples/minimal"
          - "examples/selective"
          - "examples/production"
          - "examples/cloudability-complement"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Prepare provider plugin cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${TF_PLUGIN_CACHE_DIR}"

      - name: Cache Terraform provider plugins
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          # Key on every .terraform.lock.hcl in the repo so a provider
          # bump invalidates the cache automatically.
          key: ${{ runner.os }}-tf-plugins-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-plugins-

      - name: terraform init (no backend)
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false -no-color

      - name: terraform validate
        id: tf_validate
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          set -euo pipefail
          terraform validate -no-color

      # Emit a per-matrix-leg artifact that the `summary` job aggregates
      # into a markdown table. We sanitize the path for the artifact name
      # because "." and "/" are not valid in artifact names.
      - name: Record matrix result
        if: always()
        shell: bash
        env:
          MATRIX_PATH: ${{ matrix.path }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/validate-results"
          safe_name="$(printf '%s' "${MATRIX_PATH}" | tr '/.' '__')"
          if [[ -z "${safe_name}" || "${safe_name}" == "_" ]]; then
            safe_name="root"
          fi
          printf '%s\t%s\n' "${MATRIX_PATH}" "${JOB_STATUS}" \
            > "${RUNNER_TEMP}/validate-results/${safe_name}.tsv"

      - name: Upload matrix result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: validate-result-${{ strategy.job-index }}
          path: ${{ runner.temp }}/validate-results/
          retention-days: 1
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # tflint — repo-root .tflint.hcl, recursive over modules + examples
  # -------------------------------------------------------------------------
  tflint:
    name: tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6  # v4.1.1
        with:
          tflint_version: latest

      - name: tflint --init
        shell: bash
        run: |
          set -euo pipefail
          tflint --init

      - name: tflint --recursive
        shell: bash
        run: |
          set -euo pipefail
          tflint --recursive --format compact

  # -------------------------------------------------------------------------
  # checkov — security baseline; hard-fails on new findings
  # -------------------------------------------------------------------------
  checkov:
    name: checkov
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      # bridgecrewio/checkov-action is intentionally pinned to @master because
      # Checkov's upstream README requires that ref — the action does not
      # publish stable semver tags for `uses:` consumption. Scorecard's
      # Pinned-Dependencies heuristic will flag this; it is the documented
      # exception. Hardening path: pin to a full commit SHA from
      # https://github.com/bridgecrewio/checkov-action/commits/master and
      # let Dependabot bump it on a schedule.
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
          # Workflow-level skips for framework-wide patterns (vs inline
          # `# checkov:skip=` for resource-specific cases). Each one is
          # documented in docs/COMPLIANCE_NOTES.md "Workflow-level
          # Checkov skips":
          #   CKV_AWS_111: wildcards in IAM are required for the framework's
          #                EC2/RDS/ASG actions (no resource-level perms)
          #   CKV2_AWS_5:  SGs are not provisioned by this framework
          #   CKV_AWS_117: Lambdas in a VPC is a roadmap item; the framework
          #                Lambdas don't need VPC access (they call AWS APIs only)
          skip_check: CKV_AWS_111,CKV2_AWS_5,CKV_AWS_117

  # -------------------------------------------------------------------------
  # summary — aggregate the validate matrix into a markdown table on
  # GITHUB_STEP_SUMMARY. Runs even when validate legs fail so reviewers
  # see the full matrix outcome in one place.
  # -------------------------------------------------------------------------
  summary:
    name: validate summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    if: always()
    steps:
      - name: Download matrix results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: validate-result-*
          path: validate-results
          merge-multiple: true

      - name: Render markdown summary
        shell: bash
        env:
          VALIDATE_NEEDS_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail

          results_dir="validate-results"
          {
            echo "## Terraform validate matrix"
            echo ""
            echo "| Path | Result |"
            echo "| --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ ! -d "${results_dir}" ]] || ! compgen -G "${results_dir}/*.tsv" > /dev/null; then
            echo "| _(no results found)_ | :warning: |" >> "${GITHUB_STEP_SUMMARY}"
            echo "Aggregate validate result: ${VALIDATE_NEEDS_RESULT}" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # Sort so "." (root) sorts before examples/* deterministically.
          while IFS=$'\t' read -r path_value status_value; do
            case "${status_value}" in
              success)   icon=":white_check_mark: pass" ;;
              failure)   icon=":x: fail" ;;
              cancelled) icon=":no_entry: cancelled" ;;
              skipped)   icon=":fast_forward: skipped" ;;
              *)         icon=":grey_question: ${status_value}" ;;
            esac
            printf '| `%s` | %s |\n' "${path_value}" "${icon}" \
              >> "${GITHUB_STEP_SUMMARY}"
          done < <(cat "${results_dir}"/*.tsv | sort)

          {
            echo ""
            echo "Aggregate validate result: \`${VALIDATE_NEEDS_RESULT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # Mirror the aggregate validate outcome so this job's status reflects
      # whether the matrix passed. Without this the summary job would
      # always be green, masking a failed leg in branch protection.
      - name: Reflect aggregate validate result
        shell: bash
        env:
          VALIDATE_NEEDS_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          if [[ "${VALIDATE_NEEDS_RESULT}" != "success" ]]; then
            echo "validate matrix did not succeed: ${VALIDATE_NEEDS_RESULT}" >&2
            exit 1
          fi
