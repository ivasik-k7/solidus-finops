name: terraform-ci

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**/*.py"
      - ".github/workflows/terraform-ci.yml"
      - ".tflint.hcl"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**/*.py"
      - ".github/workflows/terraform-ci.yml"
      - ".tflint.hcl"

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - run: terraform fmt -check -recursive

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - "."
          - "examples/minimal"
          - "examples/bank-production"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: terraform init (no backend)
        working-directory: ${{ matrix.path }}
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: ${{ matrix.path }}
        run: terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive --format compact

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
          # Skip checks that conflict with framework design decisions:
          #   CKV_AWS_111: wildcards in IAM are required for ec2:Describe* etc.
          #   CKV2_AWS_5:  SGs are not provisioned by this framework
          #   CKV_AWS_117: Lambdas in a VPC is a roadmap item (see issue tracker)
          skip_check: CKV_AWS_111,CKV2_AWS_5,CKV_AWS_117
