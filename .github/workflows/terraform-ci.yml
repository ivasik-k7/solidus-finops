name: terraform-ci

# Hard-enforced static-analysis gates for Solidus FinOps.
#
# As of v0.2.1 the framework is 100% clean against every active job below.
# No advisory checks remain — Checkov runs with `soft_fail: false`, so a PR
# that introduces a new unsuppressed finding fails the build and cannot
# merge.
#
# New findings must be either fixed in code OR suppressed with an inline
# `# checkov:skip=<rule>:<reason>` comment AND a matching subsection in
# docs/COMPLIANCE_NOTES.md "Documented Checkov suppressions".

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**/*.py"
      - ".github/workflows/terraform-ci.yml"
      - ".tflint.hcl"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**/*.py"
      - ".github/workflows/terraform-ci.yml"
      - ".tflint.hcl"

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - run: terraform fmt -check -recursive

  # validate:
  #   name: terraform validate
  #   runs-on: ubuntu-latest
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       path:
  #         - "."
  #         - "examples/minimal"
  #         - "examples/selective"
  #         - "examples/production"
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: hashicorp/setup-terraform@v3
  #       with:
  #         terraform_version: 1.6.6
  #     - name: terraform init (no backend)
  #       working-directory: ${{ matrix.path }}
  #       run: terraform init -backend=false
  #     - name: terraform validate
  #       working-directory: ${{ matrix.path }}
  #       run: terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive --format compact

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
          # Workflow-level skips for framework-wide patterns (vs inline
          # `# checkov:skip=` for resource-specific cases). Each one is
          # documented in docs/COMPLIANCE_NOTES.md "Workflow-level
          # Checkov skips":
          #   CKV_AWS_111: wildcards in IAM are required for the framework's
          #                EC2/RDS/ASG actions (no resource-level perms)
          #   CKV2_AWS_5:  SGs are not provisioned by this framework
          #   CKV_AWS_117: Lambdas in a VPC is a roadmap item; the framework
          #                Lambdas don't need VPC access (they call AWS APIs only)
          skip_check: CKV_AWS_111,CKV2_AWS_5,CKV_AWS_117
